id: asp-password-spraying
title: Một IP thử nhiều tài khoản
level: high
tags:
  - attack.t1110.003
cooldown: 10m
selection:
  event.action:
    - ssh_login_failed
    - ssh_invalid_user
detection:
  type: value_count
  group_by:
    - source.ip
  timespan: 5m
  condition:
    field: user.name
    gte: 10

