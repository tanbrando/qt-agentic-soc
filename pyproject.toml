[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-soc"
version = "0.1.0"
description = "Agentic SOC Platform: System Contracts & Architecture"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "psycopg>=3.1.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "server",
    "server/src",
]
testpaths = ["tests"]
